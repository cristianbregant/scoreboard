name: scoreboard
description: "Workplace recognition for the desktop: company-verified and peer achievements as collectible cards, with XP, levels and leaderboards."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get_it: ^7.6.7
  provider: ^6.1.2
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^10.2.2
  multiview_desktop: ^2.0.2
  shared_preferences: ^2.2.2
  dio: ^5.4.1
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  intl: ^0.20.3
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.2
  pdf: ^3.13.1
  tray_manager: ^0.8.0
  lucide_icons_flutter: ^4.0.1

# multiview_desktop 2.0.2 with a fix for the "Invalid state transition from
# AppLifecycleState.hidden to AppLifecycleState.resumed" assertion when the
# window comes back from the tray. See third_party/multiview_desktop/CHANGELOG.md.
# Drop it once a release upstream includes the fix.
dependency_overrides:
  multiview_desktop:
    path: third_party/multiview_desktop

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  intl_utils: ^2.8.17

flutter:
  uses-material-design: true

  # Inter, bundled so the app works offline and PDFs can embed it.
  # License: assets/fonts/OFL.txt
  assets:
    - assets/fonts/
    - assets/tray/
    # The Linux window icon; built by tool/generate_app_icons.sh.
    - assets/app_icon/app_icon.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    # Geist, for the sidebar. License: assets/fonts/Geist-OFL.txt
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist-ExtraBold.ttf
          weight: 800


flutter_intl:
  enabled: true
  class_name: AppLocalization
  main_locale: it
  arb_dir: lib/l10n
  output_dir: lib/generated
