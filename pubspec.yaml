name: scoreboard
description: "Workplace recognition for the desktop: company-verified and peer achievements as collectible cards, with XP, levels and leaderboards."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get_it: ^7.6.7
  provider: ^6.1.2
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^4.2.0
  window_manager: ^0.3.8
  shared_preferences: ^2.2.2
  dio: ^5.4.1
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  intl: ^0.20.3
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.2
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  intl_utils: ^2.8.17

flutter:
  uses-material-design: true

  # Inter, bundled so the app works offline and PDFs can embed it.
  # License: assets/fonts/OFL.txt
  assets:
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800


flutter_intl:
  enabled: true
  class_name: AppLocalization
  main_locale: it
  arb_dir: lib/l10n
  output_dir: lib/generated
