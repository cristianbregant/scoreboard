# Builds Scoreboard for macOS, Windows and Linux and publishes the packages
# on a GitHub Release when a version tag (v1.2.3) is pushed.
#
# Signing is optional and turns on when these repository secrets exist:
#   macOS   MACOS_CERTIFICATE (base64 .p12 of a "Developer ID Application"
#           certificate), MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY
#           (e.g. "Developer ID Application: Name (TEAMID)"), and for
#           notarization APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (an
#           app-specific password).
#   Windows WINDOWS_CERTIFICATE (base64 .pfx) and WINDOWS_CERTIFICATE_PASSWORD.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      # The app's update check compares the release tag with the version it
      # was built with, so the two must match.
      - name: Tag matches pubspec.yaml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match pubspec.yaml version $version"
            exit 1
          fi

  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  macos:
    name: macOS
    needs: [version, checks]
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    env:
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_ID != '' }}
      APP: build/macos/Build/Products/Release/Scoreboard.app
      DMG: Scoreboard-macos.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Sign the app
        if: env.HAS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          keychain_password="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" build.keychain
          rm certificate.p12
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" "$APP"

      - name: Package DMG
        run: hdiutil create -volname Scoreboard -srcfolder "$APP" -ov -format UDZO "$DMG"

      - name: Sign and notarize the DMG
        if: env.HAS_CERTIFICATE == 'true' && env.HAS_NOTARIZATION == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ env.DMG }}

  windows:
    name: Windows
    needs: [version, checks]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    env:
      HAS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Sign the executable
        if: env.HAS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            build\windows\x64\runner\Release\scoreboard.exe
          Remove-Item certificate.pfx

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Scoreboard-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Scoreboard-windows-x64.zip

  linux:
    name: Linux
    needs: [version, checks]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package tarball
        run: tar -czf Scoreboard-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Scoreboard-linux-x64.tar.gz

  release:
    name: Publish release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
